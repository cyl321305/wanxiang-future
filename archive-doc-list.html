<style>
:root{
  --bg-cream:#faf5ee;--bg-warm:#f3e8db;--bg-pink:#f8ece6;
  --accent-red:#a62c2c;--accent-red-light:#c94d4d;--accent-gold:#c9a86c;
  --text-primary:#3d2b1f;--text-secondary:rgba(61,43,31,.72);--text-muted:rgba(61,43,31,.5);
  --glass:rgba(255,250,245,.9);--glass-border:rgba(166,44,44,.12);
  --card-shadow:rgba(92,61,46,.08);--radius:12px;
  --type-color:#c9a86c;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:var(--text-primary);background:var(--bg-cream);min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(201,168,108,.08),transparent 50%),radial-gradient(circle at 80% 90%,rgba(166,44,44,.05),transparent 50%);pointer-events:none;z-index:0}

/* 导航 */
.nav{position:relative;z-index:10;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:14px 40px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-primary)}
.nav-logo-mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#a62c2c,#c94d4d);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Ma Shan Zheng',serif;font-size:20px}
.nav-logo-text{font-family:'ZCOOL XiaoWei',serif;font-size:18px;font-weight:700}
.nav-right{display:flex;gap:24px}
.nav-link{color:var(--text-secondary);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:6px;transition:all .2s}
.nav-link:hover{color:var(--accent-red);background:rgba(166,44,44,.06)}
.nav-link.active{color:var(--accent-red);font-weight:500}

/* 面包屑 */
.crumb{padding:20px 40px 0;font-size:13px;color:var(--text-muted);position:relative;z-index:5}
.crumb a{color:var(--text-secondary);text-decoration:none}
.crumb a:hover{color:var(--accent-red)}
.crumb .sep{margin:0 8px;opacity:.4}

/* 主体 */
.wrap{position:relative;z-index:5;max-width:1280px;margin:20px auto 60px;padding:0 40px}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);text-decoration:none;font-size:14px;padding:8px 14px;border-radius:8px;background:var(--glass);border:1px solid var(--glass-border);margin-bottom:20px;transition:all .2s}
.back-btn:hover{color:var(--accent-red);border-color:var(--accent-red)}

/* 头部 */
.list-head{display:flex;align-items:center;gap:20px;padding:24px 32px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);margin-bottom:24px;box-shadow:0 8px 32px var(--card-shadow)}
.list-icon{width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(135deg,rgba(166,44,44,.12),rgba(166,44,44,.04));flex-shrink:0}
.list-info{flex:1}
.list-title{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:700;margin-bottom:6px}
.list-meta{font-size:13px;color:var(--text-secondary)}
.list-meta strong{color:var(--text-primary);font-weight:500}

/* 搜索栏 */
.search-bar{display:flex;gap:10px;padding:16px 24px;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);margin-bottom:20px;align-items:center}
.search-input{flex:1;padding:10px 16px;border:1px solid var(--glass-border);border-radius:8px;background:#fff;font-family:inherit;font-size:14px;color:var(--text-primary);outline:none}
.search-input:focus{border-color:var(--accent-red)}
.search-btn{padding:10px 20px;background:var(--accent-red);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;transition:all .2s}
.search-btn:hover{background:var(--accent-red-light)}
.result-count{font-size:13px;color:var(--text-muted);padding:0 4px}

/* 网格 */
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-bottom:24px}
.list-card{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .35s ease;box-shadow:0 6px 20px var(--card-shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column}
.list-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(92,61,46,.14)}
.card-media{position:relative;width:100%;aspect-ratio:16/10;background:linear-gradient(135deg,#e8d4c0,#d4bfa6);overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.list-card:hover .card-media img{transform:scale(1.06)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 60%);display:flex;align-items:flex-end;padding:12px}
.card-overlay-icon{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.card-overlay-icon svg{width:18px;height:18px;color:var(--accent-red)}
.card-body{padding:16px 18px;flex:1;display:flex;flex-direction:column}
.card-title{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:600;line-height:1.4;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.card-meta{display:flex;gap:14px;font-size:12px;color:var(--text-muted);margin-bottom:10px}
.card-meta span{display:flex;align-items:center;gap:4px}
.card-meta svg{width:12px;height:12px}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.card-tag{padding:3px 10px;background:rgba(166,44,44,.06);color:var(--text-secondary);border-radius:10px;font-size:11px}

/* 空状态 */
.empty{padding:60px 20px;text-align:center;color:var(--text-muted);background:var(--glass);border-radius:var(--radius);border:1px dashed var(--glass-border)}
.empty svg{width:60px;height:60px;opacity:.3;margin-bottom:12px}
.empty-title{font-size:16px;color:var(--text-secondary);margin-bottom:6px}

/* 页脚条数 */
.page-info{padding:16px 24px;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);text-align:center;font-size:13px;color:var(--text-muted)}

/* 响应式 */
@media(max-width:768px){
  .nav{padding:12px 20px}
  .nav-right{display:none}
  .wrap{padding:0 20px}
  .crumb{padding:16px 20px 0}
  .list-head{flex-direction:column;align-items:flex-start;padding:20px}
  .list-title{font-size:20px}
  .list-grid{grid-template-columns:1fr}
}
</style>

// ===== 当前列表类型（由页面覆盖）=====
const CURRENT_TYPE = 'doc';
const DETAIL_HREF = 'archive-preview.html';
const OVERLAY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>';

// ===== 解析URL参数 =====
const params = new URLSearchParams(window.location.search);
const kbName = params.get('kb') || '红色记忆';
const kb = kbMap.find(k => k.name === kbName) || kbMap[0];

document.getElementById('kbTitle').textContent = kb.name;
document.getElementById('sourceMeta').textContent = (kb.sources && kb.sources[0]) || '丽水市档案馆';
const kbLink = document.getElementById('kbCrumbLink');
kbLink.textContent = kb.name;
kbLink.href = 'kb-detail.html?kb=' + encodeURIComponent(kb.name);

// ===== 过滤当前类型 =====
const list = resources.filter(r => r.kb === kbName && r.type === CURRENT_TYPE);

// ===== 渲染 =====
const grid = document.getElementById('listGrid');
const totalEl = document.getElementById('totalCount');
const pageInfoEl = document.getElementById('pageInfo');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const resultCount = document.getElementById('resultCount');

function render(data) {
  grid.innerHTML = '';
  if (!data.length) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <div class="empty-title">未找到匹配的档案</div>
        <div>请尝试其他关键词或更换筛选条件</div>
      </div>`;
    resultCount.textContent = '';
    pageInfoEl.textContent = '共 0 条档案';
    return;
  }
  data.forEach(res => {
    const card = document.createElement('a');
    card.className = 'list-card';
    card.href = DETAIL_HREF + '?' + new URLSearchParams({ title: res.title, type: res.type, date: res.date, size: res.size, source: res.source, kb: res.kb, desc: res.desc || res.title, tags: (res.tags||[]).join(','), img: res.image || '' }).toString();
    card.innerHTML = `
      <div class="card-media">
        <img src="${res.image}" alt="${res.title}" onerror="this.style.display='none'">
        <div class="card-overlay">
          <div class="card-overlay-icon">${OVERLAY_SVG}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${res.title}</div>
        <div class="card-meta">
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${res.date}</span>
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>${res.size}</span>
        </div>
        <div class="card-tags">${res.tags.slice(0,3).map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
      </div>`;
    grid.appendChild(card);
  });
  resultCount.textContent = '显示 ' + data.length + ' 条';
  pageInfoEl.textContent = '共 ' + data.length + ' 条档案 · 来源：' + (kb.sources ? kb.sources.join('、') : '丽水市档案馆');
}

totalEl.textContent = list.length;
render(list);

// 搜索
function doSearch() {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { render(list); return; }
  const filtered = list.filter(r =>
    r.title.toLowerCase().includes(q) ||
    r.tags.some(t => t.toLowerCase().includes(q))
  );
  render(filtered);
}
searchBtn.addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
</script>
