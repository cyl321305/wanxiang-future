<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>丽水党组织发展知识图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#eef1f6;
    --card:#ffffff;
    --ink:#17212c; --ink2:#59667a; --ink3:#93a1b3;
    --line:#e3e9f1; --line2:#eef2f7;
    --accent:#c0392b; --accent2:#e07a6a; --accent-soft:#fdeeec;
    --c-org:#2f7fd0; --c-evt:#d98024; --c-loc:#2f9e6a; --c-per:#7a52b3; --c-doc:#0f8f88;
    --shadow:0 1px 2px rgba(23,33,44,.05),0 6px 20px rgba(23,33,44,.06);
  }
  html,body{height:100%}
  body{
    font-family:'Noto Sans SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:13px; line-height:1.6;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{color:inherit;text-decoration:none}

  /* ============ 顶栏 ============ */
  .top{
    flex:0 0 auto; height:56px; background:var(--card); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:0 18px; z-index:20;
  }
  .back{
    width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink2);
    transition:.18s; flex:0 0 auto;
  }
  .back:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand i{width:3px;height:26px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent2));flex:0 0 auto}
  .brand h1{font-family:'Noto Serif SC',serif;font-size:16.5px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
  .brand p{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top-r{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .stat{
    display:flex;align-items:baseline;gap:4px;padding:5px 11px;border-radius:9px;
    background:#f6f8fb;border:1px solid var(--line2);font-size:11.5px;color:var(--ink3);
  }
  .stat b{font-size:14px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

  /* ============ 布局 ============ */
  .wrap{
    flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);
    gap:12px;padding:12px;
  }
  .wrap.detail{grid-template-columns:minmax(0,1fr) 392px}
  .stage{min-height:0;display:flex;flex-direction:column;gap:12px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
  .ph{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:11px 15px;border-bottom:1px solid var(--line2);
  }
  .ph h3{font-size:13.5px;font-weight:700;white-space:nowrap}
  .ph .sub{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .btn{
    height:28px;padding:0 11px;border-radius:8px;border:1px solid var(--line);
    font-size:11.5px;color:var(--ink2);background:#fff;transition:.16s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--c-org);color:var(--c-org);background:#f6faff}
  .sw{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap}
  .sw input{width:14px;height:14px;accent-color:var(--accent);cursor:pointer}

  /* 图例 */
  .legend{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
  .legend span{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap}
  .legend i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

  /* ============ 画布 ============ */
  .p-graph{flex:1;min-height:0}
  .cv{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:0 0 14px 14px;
    background:
      radial-gradient(circle at 50% 42%,rgba(47,127,208,.05),transparent 62%),
      linear-gradient(0deg,rgba(23,33,44,.028) 1px,transparent 1px) 0 0/100% 26px,
      linear-gradient(90deg,rgba(23,33,44,.028) 1px,transparent 1px) 0 0/26px 100%,
      #fbfcfe;
  }
  #svg{display:block;width:100%;height:100%;cursor:grab;user-select:none;-webkit-user-select:none}
  #svg.grabbing{cursor:grabbing}
  #gZoom.anim{transition:transform .32s cubic-bezier(.4,0,.2,1)}
  .hint{
    position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--ink3);
    background:rgba(255,255,255,.86);border:1px solid var(--line2);border-radius:8px;
    padding:4px 10px;pointer-events:none;backdrop-filter:blur(4px);
  }
  .zoomctl{position:absolute;right:14px;bottom:12px;display:flex;flex-direction:column;gap:5px}
  .zoomctl button{
    width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.94);
    border:1px solid var(--line);color:var(--ink2);font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(23,33,44,.07);
  }
  .zoomctl button:hover{border-color:var(--c-org);color:var(--c-org)}

  /* 悬浮小卡片 */
  .tip{
    position:absolute;z-index:30;width:248px;pointer-events:none;opacity:0;
    transform:translateY(6px);transition:opacity .16s,transform .16s;
    background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 34px rgba(16,28,44,.16);padding:11px 12px 10px;
  }
  .tip.on{opacity:1;transform:translateY(0)}
  .tip-h{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .tip-h .ti{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .tip-h b{font-size:13px;font-weight:700;line-height:1.3;flex:1;min-width:0}
  .tip-m{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);margin-bottom:5px}
  .tip-m em{font-style:normal;padding:1px 6px;border-radius:5px;background:#f4f7fb;color:var(--ink2)}
  .tip p{font-size:11.5px;color:var(--ink2);line-height:1.62;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .tip-f{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:11px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
  .tip-f b{color:var(--accent)}

  /* SVG 元素 */
  .edge{fill:none;stroke:#bccadb;stroke-width:1.3;transition:stroke .18s,stroke-width .18s}
  .edge.hot{stroke:var(--accent);stroke-width:1.9;stroke-opacity:.92}
  .edge.faint{stroke-opacity:.32}
  .elbl{font-size:10px;fill:#7f8da0;font-family:'Noto Sans SC',sans-serif;
    paint-order:stroke;stroke:rgba(255,255,255,.96);stroke-width:4;stroke-linejoin:round;pointer-events:none}
  .elbl.hot{fill:var(--accent);font-weight:600}
  .nd{cursor:grab}
  .nd.dragging{cursor:grabbing}
  .nd.dragging .pic{filter:brightness(1.05) drop-shadow(0 8px 16px rgba(23,33,44,.28))}
  .nd.dragging .halo{opacity:.3}
  .nd.pop .in{animation:ndpop .34s ease both}
  @keyframes ndpop{from{opacity:0}to{opacity:1}}
  .nd .halo{opacity:0;transition:opacity .18s}
  .nd:hover .halo{opacity:.22}
  .nd.sel .halo{opacity:.34}
  .nd.faint{opacity:.2}
  .nd .pic{transition:filter .18s}
  .nd:hover .pic{filter:brightness(1.03)}
  .nd .selr{fill:none;stroke:transparent;stroke-width:0;transition:stroke .18s,stroke-width .18s}
  .nd.sel .selr{stroke:var(--accent);stroke-width:2.6}
  .nd .lb{font-size:11.5px;font-weight:500;fill:var(--ink);text-anchor:middle;
    paint-order:stroke;stroke:rgba(255,255,255,.94);stroke-width:3.2;stroke-linejoin:round;
    font-family:'Noto Sans SC',sans-serif;pointer-events:none}
  .nd.sel .lb{fill:var(--accent);font-weight:700}
  .nd .kd{font-size:9.5px;fill:var(--ink3);text-anchor:middle;
    paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:2.6;
    font-family:'Noto Sans SC',sans-serif;pointer-events:none}
  .fadein{animation:fi .34s ease both}
  @keyframes fi{from{opacity:0}to{opacity:1}}

  /* ============ 时间轴 ============ */
  .p-tl{flex:0 0 146px}
  .tlbody{flex:1;min-height:0;padding:2px 15px 0}
  #track{position:relative;height:118px;user-select:none;touch-action:none}
  .band{
    position:absolute;top:6px;bottom:16px;border-radius:10px;
    background:linear-gradient(180deg,rgba(192,57,43,.075),rgba(192,57,43,.035));
    border:1px solid rgba(192,57,43,.22);cursor:grab;z-index:2;
  }
  .band:active{cursor:grabbing}
  .band::after{
    content:'';position:absolute;left:50%;top:6px;bottom:6px;width:0;
    border-left:1px dashed rgba(192,57,43,.2);
  }
  .bar{position:absolute;bottom:26px;border-radius:3px 3px 0 0;background:#ccd7e4;transition:background .18s;z-index:4}
  .bar.on{background:var(--accent)}
  .axis{position:absolute;left:0;right:0;bottom:25px;height:1.5px;background:#dbe3ed;z-index:1}
  .tick{
    position:absolute;bottom:4px;transform:translateX(-50%);font-size:10.5px;color:var(--ink3);
    font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;transition:color .18s;z-index:3;
  }
  .tick.on{color:var(--accent);font-weight:700}
  .tick i{position:absolute;left:50%;bottom:16px;width:1px;height:6px;background:#e0e7f0;transform:translateX(-50%)}
  .hnd{
    position:absolute;top:2px;bottom:12px;width:12px;margin-left:-6px;z-index:6;cursor:ew-resize;
    display:flex;align-items:center;justify-content:center;
  }
  .hnd::before{
    content:'';width:13px;height:100%;border-radius:7px;background:#fff;
    border:2px solid var(--accent);box-shadow:0 3px 10px rgba(192,57,43,.26);
  }
  .hnd::after{
    content:'';position:absolute;width:5px;height:15px;border-radius:1px;
    background:linear-gradient(90deg,var(--accent) 0 1.5px,transparent 1.5px 3.5px,var(--accent) 3.5px 5px);
  }
  .hnd:hover::before{background:var(--accent-soft)}
  .eras{display:flex;gap:5px;flex-wrap:nowrap}
  .era{
    height:25px;padding:0 9px;border-radius:8px;border:1px solid var(--line);
    font-size:11px;color:var(--ink2);background:#fff;white-space:nowrap;transition:.16s;
  }
  .era:hover{border-color:var(--c-org);color:var(--c-org)}
  .era.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tlnum{font-size:11.5px;color:var(--ink3);white-space:nowrap}
  .tlnum b{color:var(--accent);font-size:13px;font-variant-numeric:tabular-nums}

  /* ============ 详情栏（默认收起，点击实体后滑出） ============ */
  .p-detail{min-height:0;display:none}
  .wrap.detail .p-detail{display:flex;animation:dpanel .3s cubic-bezier(.4,0,.2,1) both}
  @keyframes dpanel{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
  .dbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
  .dbody::-webkit-scrollbar{width:8px}
  .dbody::-webkit-scrollbar-thumb{background:#dbe3ed;border-radius:4px;border:2px solid #fff}
  .dwrap{padding:15px}
  .dempty{
    padding:60px 26px;text-align:center;color:var(--ink3);
  }
  .dempty .di{
    width:62px;height:62px;margin:0 auto 14px;border-radius:19px;background:#f4f7fb;
    display:flex;align-items:center;justify-content:center;
  }
  .dempty b{display:block;font-size:13.5px;color:var(--ink2);font-weight:600;margin-bottom:6px}
  .dempty p{font-size:11.5px;line-height:1.75}

  .dhead{display:flex;gap:12px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line2)}
  .dico{
    width:50px;height:50px;border-radius:15px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb,var(--c) 12%,#fff);
    border:1.5px solid color-mix(in srgb,var(--c) 32%,#fff);
  }
  .dh-t{flex:1;min-width:0}
  .dh-t h2{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:700;line-height:1.34;letter-spacing:.2px}
  .dchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .chip{
    font-size:10.5px;padding:2px 8px;border-radius:6px;line-height:1.5;
    background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);font-weight:600;
  }
  .chip.ghost{background:#f4f7fb;color:var(--ink2);font-weight:400}

  .dsec{margin-top:16px}
  .dsec h4{
    font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.4px;
    display:flex;align-items:center;gap:7px;margin-bottom:9px;
  }
  .dsec h4::before{content:'';width:3px;height:12px;border-radius:2px;background:var(--accent)}
  .dsec h4 .cnt{font-size:10.5px;color:var(--ink3);font-weight:500;margin-left:auto}
  .dtext{font-size:12.5px;color:var(--ink2);line-height:1.82;text-align:justify}
  .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:12px}
  .kv dt{color:var(--ink3);white-space:nowrap}
  .kv dd{color:var(--ink2)}

  .quote{
    margin-top:10px;padding:10px 12px;border-radius:10px;background:#fbfaf6;
    border:1px solid #f0ead9;font-size:12px;color:#6b5c3f;line-height:1.78;
  }
  .quote i{display:block;font-style:normal;font-size:10.5px;color:#a08f6c;margin-top:6px;text-align:right}

  .rels{list-style:none;display:flex;flex-direction:column;gap:5px}
  .rels li{
    display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:9px;
    background:#fafbfd;border:1px solid var(--line2);font-size:12px;transition:.15s;
  }
  .rels li:hover{background:#f5f9ff;border-color:#dcE8f6}
  .rels .ad{
    width:17px;height:17px;border-radius:5px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:11px;background:#eef3f9;color:var(--ink3);
  }
  .rels .ad.in{background:var(--accent-soft);color:var(--accent)}
  .rels .rv{color:var(--ink3);font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .rels a{font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:4px;min-width:0}
  .rels a:hover{color:var(--accent)}
  .rels a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:118px}
  .rels .ry{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .rels .dotc{width:7px;height:7px;border-radius:50%;flex:0 0 auto}

  .docprev{border-radius:10px;overflow:hidden;border:1px solid #e6ddc8;margin-bottom:9px;background:#f7f1e4}
  .docprev svg{display:block;width:100%;height:122px}
  .docs{list-style:none;display:flex;flex-direction:column;gap:6px}
  .docs li{display:flex;gap:8px;padding:8px 10px;border-radius:9px;background:#fafbfd;border:1px solid var(--line2)}
  .docs .di{
    width:19px;height:19px;border-radius:5px;background:#eef3f9;color:var(--ink3);
    font-size:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;
    font-variant-numeric:tabular-nums;
  }
  .docs b{display:block;font-size:12px;font-weight:600;line-height:1.5}
  .docs span{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px}
  .more{
    margin-top:8px;font-size:11.5px;color:var(--c-org);cursor:pointer;text-align:center;
    padding:6px;border-radius:8px;background:#f4f8fd;
  }
  .more:hover{background:#eaf2fb}
  .quick{display:flex;flex-wrap:wrap;gap:6px}
  .quick .qk{
    display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;
    background:#fafbfd;border:1px solid var(--line2);font-size:12px;color:var(--ink);transition:.15s;
  }
  .quick .qk:hover{background:#f4f9ff;border-color:#d8e6f5;color:var(--c-org)}
  .quick .qk i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .quick .qk em{font-style:normal;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

  /* ============ 响应式 ============ */
  @media (max-width:1180px){
    body{overflow:auto}
    .wrap{grid-template-columns:minmax(0,1fr);height:auto;overflow:visible}
    .wrap.detail{grid-template-columns:minmax(0,1fr)}
    .wrap.detail .p-detail{display:flex;height:auto;max-height:none}
    .stage{display:block}
    .p-graph{height:520px;margin-bottom:12px}
    .p-tl{height:160px;margin-bottom:12px}
    .dbody{max-height:none;overflow:visible}
  }
  @media (max-width:760px){
    .top{height:auto;flex-wrap:wrap;padding:10px 12px;gap:9px}
    .top-r{margin-left:0;width:100%;overflow-x:auto}
    .ph{flex-wrap:wrap;gap:8px}
    .ph-r{margin-left:0;width:100%;overflow-x:auto;padding-bottom:2px}
    .legend{display:none}
    .p-graph{height:440px}
    .tip{width:210px}
  }
</style>
</head>
<body>

<header class="top">
  <a class="back" href="knowledge-graph.html" title="返回知识图谱列表">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <div class="brand">
    <i></i>
    <div>
      <h1>丽水党组织发展知识图谱</h1>
      <p>1923—2000 · 丽水地方党组织创建、发展与壮大的完整时间线（26 个骨干实体）</p>
    </div>
  </div>
  <div class="top-r">
    <span class="stat"><b>26</b>实体</span>
    <span class="stat"><b>23</b>关系</span>
    <span class="stat"><b>23</b>档案</span>
  </div>
</header>

<main class="wrap">
  <section class="stage">

    <!-- ============ 图谱 ============ -->
    <div class="panel p-graph">
      <div class="ph">
        <h3>党组织沿革年表</h3>
        <span class="sub" id="gSub"></span>
        <div class="ph-r">
          <div class="legend" id="legend"></div>

          <button class="btn" id="btnIdx">实体索引</button>
          <button class="btn" id="btnFit">适应窗口</button>
          <button class="btn" id="btnRe">重新排布</button>
        </div>
      </div>
      <div class="cv" id="cv">
        <svg id="svg"></svg>
        <div class="tip" id="tip"></div>
        <div class="hint">滚轮缩放 · 空白处拖动平移 · 拖动实体可自由摆放（关系线条自动跟随）</div>
        <div class="zoomctl">
          <button id="zin" title="放大">+</button>
          <button id="zout" title="缩小">−</button>
        </div>
      </div>
    </div>


  </section>

  <!-- ============ 详情 ============ -->
  <aside class="panel p-detail">
    <div class="ph">
      <h3>实体详情</h3>
      <span class="sub" id="dSub"></span>
      <div class="ph-r">
        <button class="btn" id="btnClose">收起 ›</button>
      </div>
    </div>
    <div class="dbody" id="dBody"></div>
  </aside>
</main>

  <script>
  /* ================================================================
     ART —— 实体插图库（把实体渲染成"页面上的图片"）+ 档案影印件预览
     全部为手绘 SVG，不依赖任何位图素材
     ================================================================ */
  var __uid = 0;
  function uid() { return 'a' + (++__uid); }
  /* #rrggbb + alpha → rgba() */
  function tint(hex, a) {
    var n = parseInt(String(hex).slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  /* 归一化坐标：把 100 单位设计稿映射到 S 像素 */

  /* ---------------------------------------------------------------

  /* ==================== 视图变换 ==================== */

  /* ==================== 实体自由拖动（关系线条实时跟随） ==================== */

  /* 只负责重绘：布局恒定，时间轴变化时实体在原位淡入，形成"逐一变动" */
  function render(pop) {

  function buildSVG(pop) {

          if (x2 - x1 > 62) {

  /* ==================== 时间轴 ==================== */

  function tlStep() {
    var n = YEARS.length, W = trackW(), PAD = 34;
    return n > 1 ? (W - 2 * PAD) / (n - 1) : 0;
  }
  function tlX(i) { return 34 + i * tlStep(); }

  function buildTL() {
    var bars = $('bars'), ticks = $('ticks');
    var cnt = {}; NODES.forEach(function (n) { if (n.yi != null) cnt[n.yi] = (cnt[n.yi] || 0) + 1; });
    var mx = 1; Object.keys(cnt).forEach(function (k) { mx = Math.max(mx, cnt[k]); });
    var B = [], T = [];
    YEARS.forEach(function (y, i) {
      var x = tlX(i), c0 = cnt[i] || 0;
      if (c0 > 0) {
        var h = 7 + Math.round(33 * (c0 / mx));
        B.push('<span class="bar" data-y="' + i + '" style="left:' + (x - 7) + 'px;width:14px;height:' + h + 'px"></span>');
      }
      T.push('<span class="tick" data-y="' + i + '" style="left:' + x + 'px">' + y + '<i></i></span>');
    });
    bars.innerHTML = B.join('');
    ticks.innerHTML = T.join('');
    Array.prototype.forEach.call(ticks.querySelectorAll('.tick'), function (t) {
      t.addEventListener('click', function () {
        var i = +t.getAttribute('data-y'), span = TLB.i1 - TLB.i0;

      });
    });
  }

  function setWin(a, b, span, pop) {
    var n = YEARS.length;
    if (span != null) { TLB.i0 = clamp(a, 0, n - 1); TLB.i1 = clamp(TLB.i0 + span, 0, n - 1); }
    else {
      if (a > b) { var t = a; a = b; b = t; }
      TLB.i0 = clamp(a, 0, n - 1); TLB.i1 = clamp(b, 0, n - 1);
    }
    updateTL();
    render(!!pop);
    renderDetail();

  function updateTL() {
    var x0 = tlX(TLB.i0), x1 = tlX(TLB.i1);
    var bl = x0 - 9, br = x1 + 9;

    if (bw > br - bl) { bl = bl - (bw - (br - bl)) / 2; }
    $('band').style.left = bl + 'px';
    $('band').style.width = bw + 'px';
    $('h0').style.left = bl + 'px';
    $('h1').style.left = (bl + bw) + 'px';
    var cnt = 0;
    NODES.forEach(function (n) { if (n.yi >= TLB.i0 && n.yi <= TLB.i1) cnt++; });
    txt('tlNow', '已选 ' + YEARS[TLB.i0] + (TLB.i1 > TLB.i0 ? ' — ' + YEARS[TLB.i1] : '') + ' · 该时段 ' + cnt + ' 个实体');

    Array.prototype.forEach.call(document.querySelectorAll('.era'), function (e) {
      e.classList.toggle('on', ERA_IDX[e.getAttribute('data-era')] &&
        ERA_IDX[e.getAttribute('data-era')][0] === TLB.i0 && ERA_IDX[e.getAttribute('data-era')][1] === TLB.i1);
    });
  }

  var ERA_IDX = {};
  function buildEras() {
    var wrap = $('eras'); if (!wrap) return;
    var H = [];
    ERAS.forEach(function (e, k) {
      var a = -1, b = -1;
      YEARS.forEach(function (y, i) {
        var v = parseInt(y, 10);
        if (v >= e.a && v <= e.b) { if (a < 0) a = i; b = i; }
      });
      ERA_IDX['e' + k] = [a, b];
      H.push('<button class="era" data-era="e' + k + '">' + esc(e.n) + '<span style="opacity:.62;font-size:10px;margin-left:3px">' +
        e.a + '–' + e.b + '</span></button>');
    });
    wrap.innerHTML = H.join('');
    Array.prototype.forEach.call(wrap.querySelectorAll('.era'), function (b) {
      b.addEventListener('click', function () {
        var r = ERA_IDX[b.getAttribute('data-era')];
        if (r[0] >= 0) setWin(r[0], r[1], null, true);
      });
    });
  }

  function initTLDrag() {
    if (!HAS_TL) return;
    var track = $('track');
    function idxAt(clientX) {
      var r = track.getBoundingClientRect();
      var st = tlStep();
      if (!st) return 0;
      return clamp(Math.round((clientX - r.left - 34) / st), 0, YEARS.length - 1);
    }
    function down(mode, e) {
      e.preventDefault(); e.stopPropagation();
      var i = idxAt(e.clientX);
      TLB.drag = { m: mode, i: i, i0: TLB.i0, i1: TLB.i1, span: TLB.i1 - TLB.i0 };
      document.body.style.userSelect = 'none';
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    }
    function move(e) {
      var d = TLB.drag; if (!d) return;
      var i = idxAt(e.clientX);
      if (d.m === 'l') { TLB.i0 = Math.min(i, d.i1); TLB.i1 = d.i1; }
      else if (d.m === 'r') { TLB.i1 = Math.max(i, d.i0); TLB.i0 = d.i0; }
      else { var k = i - d.i; var a = clamp(d.i0 + k, 0, YEARS.length - 1 - d.span); TLB.i0 = a; TLB.i1 = a + d.span; }
      updateTL(); render(false);
    }
    function up() {
      TLB.drag = null; document.body.style.userSelect = '';
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      render(true);            /* 松手后剩余实体逐一淡入 */
      renderDetail();
    }
    $('h0').addEventListener('pointerdown', function (e) { down('l', e); });
    $('h1').addEventListener('pointerdown', function (e) { down('r', e); });
    $('band').addEventListener('pointerdown', function (e) { down('m', e); });
    track.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.hnd') || e.target.closest('.band')) return;
      var i = idxAt(e.clientX), span = TLB.i1 - TLB.i0;
      setWin(clamp(Math.round(i - span / 2), 0, YEARS.length - 1), 0, span, true);
    });
    $('h0').addEventListener('dblclick', function (e) { e.stopPropagation(); });
  }

  /* ==================== 画布交互 ==================== */
  function initGraph() {
    var svg = $('svg'), cv = $('cv');
    var pan = null, moved = false;
    svg.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.nd')) return;
      pan = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
      moved = false;
      svg.classList.add('grabbing');
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    });
    svg.addEventListener('pointermove', function (e) {
      if (!pan) return;
      var dx = e.clientX - pan.x, dy = e.clientY - pan.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      state.tx = pan.tx + dx;
      state.ty = pan.ty + dy;
      applyT();
    });
    function endpan() { if (pan) { pan = null; svg.classList.remove('grabbing'); } }
    svg.addEventListener('pointerup', endpan);
    svg.addEventListener('pointercancel', endpan);
    svg.addEventListener('click', function () {
      if (moved) { moved = false; return; }
      clearSel();
    });
    svg.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r = svg.getBoundingClientRect();
      var mx = e.clientX - r.left, my = e.clientY - r.top;
      var k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      var nz = clamp(state.z * k, 0.18, 3);
      var sc = nz / state.z;
      state.tx = mx - (mx - state.tx) * sc;
      state.ty = my - (my - state.ty) * sc;
      state.z = nz;
      applyT();
    }, { passive: false });
    $('zin').addEventListener('click', function () { zoomAt(1.2); });
    $('zout').addEventListener('click', function () { zoomAt(1 / 1.2); });
    var bf = $('btnFit');
    if (bf) {
      if (CHRONO) {
        bf.textContent = '重置视图';
        bf.addEventListener('click', function () { resetView(); applyT(true); });
      } else {
        bf.addEventListener('click', function () { fitView(); applyT(true); });
      }
    }
    var br = $('btnRe');
    if (br) {
      br.textContent = CHRONO ? '还原布局' : '重新排布';
      br.addEventListener('click', function () {
        state.off = {};                 /* 清掉手动拖动位移，回到自动布局 */
        lay(); render(false); applyT(true);
      });
    }
    var bc = $('btnClose');
    if (bc) bc.addEventListener('click', clearSel);
    var bi = $('btnIdx');
    if (bi) bi.addEventListener('click', function () {
      state.sel = null; paintState(); renderDetail(); openPanel();
    });
    var cb = $('cbNbr');
    if (cb) cb.addEventListener('change', function () { nbrOn = cb.checked; render(false); renderDetail(); });
  }
  function zoomAt(k) {
    var cx = VW / 2, cy = VH / 2;
    var nz = clamp(state.z * k, 0.18, 3), sc = nz / state.z;
    state.tx = cx - (cx - state.tx) * sc;
    state.ty = cy - (cy - state.ty) * sc;
    state.z = nz; applyT();
  }

  /* ==================== 图例 ==================== */
  function buildLegend() {
    var wrap = $('legend'); if (!wrap) return;
    var seen = {};
    NODES.forEach(function (n) { seen[n.cat] = (seen[n.cat] || 0) + 1; });
    var H = [];
    CAT_ORDER.forEach(function (c) {
      if (!seen[c]) return;
      H.push('<span><i style="background:' + CATC[c] + '"></i>' + c + ' ' + seen[c] + '</span>');
    });
    wrap.innerHTML = H.join('');
  }

  /* ==================== 启动 ==================== */
  function sizeCanvas() {
    var cv = $('cv');
    var r = cv.getBoundingClientRect();
    VW = Math.max(320, r.width); VH = Math.max(260, r.height);
    var svg = $('svg');
    svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);
  }

  function boot() {
    tipEl = $('tip');
    PIC_W = CHRONO ? 74 : 84;        /* 年表页列距 105，图片 74 刚好留出呼吸 */
    SHOW_ALL_LBL = false;            /* 关系由线条本身承载；关系文字只在悬停/选中时出现 */
    sizeCanvas();
    buildLegend();
    initGraph();
    initNodeDrag();
    var cb0 = $('cbNbr');
    if (cb0) nbrOn = !!cb0.checked;
    if (HAS_TL) {
      TLB.i0 = clamp(YSIDX(DEFAULT_WIN[0]), 0, YEARS.length - 1);
      TLB.i1 = clamp(YSIDX(DEFAULT_WIN[1]), 0, YEARS.length - 1);
      if (TLB.i1 < TLB.i0) { var t = TLB.i0; TLB.i0 = TLB.i1; TLB.i1 = t; }
      buildEras();
      initTLDrag();
    }
    relayout(false);
    renderDetail();
  }
  function YSIDX(y) { var i = YEARS.indexOf(String(y)); return i < 0 ? 0 : i; }

  window.addEventListener('resize', function () { relayout(false); });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  })();
  </script>
</body>
</html>
